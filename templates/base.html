<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Passport Photo Auto‑Crop Manager{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --primary:#3b5bdb; --primary-dark:#364fc7; --bg:#f4f6fb; --card-shadow:0 4px 24px rgba(30,40,80,0.08); --radius:14px; }
    body { font-family:'Inter',system-ui,-apple-system,sans-serif; background:var(--bg); color:#1e293b; }
    .navbar { background:linear-gradient(135deg,#3b5bdb 0%,#5f3dc4 100%); box-shadow:0 2px 12px rgba(59,91,219,0.25); }
    .navbar-brand { font-weight:700; letter-spacing:-0.02em; font-size:1.15rem; }
    .navbar-brand i { background:rgba(255,255,255,0.18); padding:6px 8px; border-radius:8px; margin-right:8px; }
    .card-modern { border:none; border-radius:var(--radius); box-shadow:var(--card-shadow); background:#fff; }
    .card-modern .card-header { background:transparent; border-bottom:1px solid #eef2f7; font-weight:600; color:#1e293b; }
    .stat-icon { width:44px; height:44px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:1.25rem; }
    .progress { border-radius:999px; background:#e9eef8; }
    .progress-bar { border-radius:999px; background:linear-gradient(90deg,#3b5bdb,#5f3dc4); }
    .btn-primary { background:var(--primary); border-color:var(--primary); font-weight:500; border-radius:8px; padding:8px 18px; }
    .btn-primary:hover { background:var(--primary-dark); border-color:var(--primary-dark); }
    .btn-success { border-radius:8px; font-weight:500; }
    .form-select, .form-control { border-radius:8px; border-color:#dbe4f0; }
    .form-select:focus, .form-control:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(59,91,219,0.12); }
    footer { color:#94a3b8; font-size:0.85rem; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="{{ url_for('dashboard.dashboard') }}">
        <i class="bi bi-crop"></i> Passport Photo Auto‑Crop Manager
      </a>
      <div class="ms-auto d-flex gap-2">
        <a href="{{ url_for('dashboard.dashboard') }}" class="btn btn-sm btn-light bg-white bg-opacity-15 text-white border-0"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a>
        <a href="{{ url_for('photos.photos_list') }}" class="btn btn-sm btn-light bg-white text-primary"><i class="bi bi-images me-1"></i>View Photos</a>
        <a href="{{ url_for('logs.logs_list') }}" class="btn btn-sm btn-light bg-white text-primary"><i class="bi bi-clock-history me-1"></i>Logs</a>
      </div>
    </div>
  </nav>

  <div class="container pb-5">
    {% block content %}{% endblock %}
  </div>

  <footer class="text-center py-4 border-top bg-white mt-auto">
    <div class="container">
      <span class="text-muted"><i class="bi bi-shield-check me-1"></i> Numerotec AutoFaceCrop &middot; Secure processing</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
